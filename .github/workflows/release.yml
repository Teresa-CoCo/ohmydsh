name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install --global pnpm@12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: node --test
      - name: Verify composition (tui + desktop)
        run: node scripts/verify-composition.mjs --profile all
      - name: Publish to npm (with provenance)
        working-directory: packages/ohmydsh
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./packages/ohmydsh/package.json").version')
          node --input-type=module <<'NODE' > release-notes.md
          import { existsSync, readFileSync } from "node:fs";

          const version = JSON.parse(readFileSync("packages/ohmydsh/package.json", "utf8")).version;
          const candidates = ["CHANGELOG.md", "packages/ohmydsh/CHANGELOG.md"];
          const path = candidates.find((file) => existsSync(file));
          let notes = "";
          if (path) {
            const lines = readFileSync(path, "utf8").split("\n");
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const heading = new RegExp("^##\\s*\\[?v?" + escaped + "\\]?(\\s|$)");
            const start = lines.findIndex((line) => heading.test(line));
            if (start !== -1) {
              const rest = lines.slice(start + 1);
              const end = rest.findIndex((line) => /^##\s/.test(line));
              notes = (end === -1 ? rest : rest.slice(0, end)).join("\n").trim();
            }
          }
          if (notes === "") {
            notes = "See the commit history for changes in v" + version + ".";
          }
          process.stdout.write(notes + "\n");
          NODE
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md
